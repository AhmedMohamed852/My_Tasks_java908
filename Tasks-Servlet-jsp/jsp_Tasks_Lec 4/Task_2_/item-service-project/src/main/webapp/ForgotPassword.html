<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8">  
<title>Forgot Password</title>  

<style>
    /* Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Poppins', Arial, sans-serif;
        background: #f4f6f9;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #222;
    }

    .container {
        width: 400px;
        background: #fff;
        border-radius: 12px;
        padding: 35px 28px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        animation: fadeIn 0.6s ease-in-out;
        text-align: center;
    }

    h2 {
        margin-bottom: 20px;
        font-size: 22px;
        color: #0d47a1;
        letter-spacing: 0.5px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        font-weight: 600;
        color: #444;
        text-align: left;
    }

    input[type="text"] {
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 14px;
        transition: 0.3s;
    }

    input:focus {
        border-color: #0d47a1;
        box-shadow: 0 0 6px rgba(13, 71, 161, 0.25);
        outline: none;
    }

    .btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #0d47a1;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn:hover {
        background: #1565c0;
        transform: translateY(-2px);
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>  

</head>  
<body>  

   <div class="container">
        <h2>🔑 Forgot Password</h2> 
        <form action="/item-service-project/userController?action=forgotPassword" method="post">  
            <label for="name">Please Enter Your Username:</label>  
            <input type="text" id="name" name="name" required>  
            <input type="submit" value="Recover Password" class="btn">  
        </form>  
   </div>

</body>  
</html>
