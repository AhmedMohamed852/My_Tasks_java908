<!DOCTYPE html>   
<html lang="en">   
<head>   
    <meta charset="UTF-8">   
    <title>Add Item</title>   

    <style>  
        /* Reset أساسي */ 
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        } 

        body { 
            font-family: 'Poppins', Arial, sans-serif; 
            background: #f4f6f9; 
            color: #222; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        } 

        .container { 
            width: 420px; 
            background: #fff; 
            border-radius: 12px; 
            padding: 35px 28px; 
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); 
            animation: fadeIn 0.6s ease-in-out; 
        } 

        h1 { 
            text-align: center; 
            font-size: 22px; 
            margin-bottom: 25px; 
            color: #0d47a1; 
            letter-spacing: 0.5px; 
        } 

        label { 
            display: block; 
            margin-bottom: 6px; 
            font-size: 14px; 
            font-weight: 600; 
            color: #444; 
        } 

        input[type="text"], 
        input[type="number"] { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 18px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            font-size: 14px; 
            transition: 0.3s; 
        } 

        input:focus { 
            border-color: #0d47a1; 
            box-shadow: 0 0 6px rgba(13, 71, 161, 0.25); 
            outline: none; 
        } 

        button, 
        input[type="submit"] { 
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 10px; 
            background: linear-gradient(135deg, #0d47a1, #1565c0); 
            color: #fff; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.3s; 
        } 

        button:hover, 
        input[type="submit"]:hover { 
            background: linear-gradient(135deg, #1565c0, #0d47a1); 
            transform: translateY(-2px); 
        } 

        .back-link { 
            margin-top: 20px; 
            text-align: center; 
        } 

        .back-link a { 
            font-size: 14px; 
            color: #0d47a1; 
            text-decoration: none; 
            font-weight: 500; 
        } 

        .back-link a:hover { 
            text-decoration: underline; 
        } 

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        } 
    </style>  
</head>   
<body>   

<div class="container">  
    <h1>➕ Add New Item</h1>  

    <form action="/item-service-project/ItemController_java" method="get">   
        <input type="hidden" name="action" value="addItem">   
        <input type="hidden" name="id" value="0">  

        <label for="name">Name:</label>  
        <input type="text" id="name" name="name" required/>   

        <label for="price">Price:</label>  
        <input type="number" id="price" name="price" step="0.01" required/>   

        <label for="totalNumber">Total Number:</label>  
        <input type="number" id="totalNumber" name="totalNumber" required/>   

        <button type="submit">Add Item</button>   
    </form>  

    <div class="back-link">  
        <a href="/item-service-project/ItemController_java?action=getItems">⬅ Back to Items</a>  
    </div>  
</div>  

</body>   
</html>
